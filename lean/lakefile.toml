name = "qppmodules"
defaultTargets = ["QppModules", "QppExamples", "QppBridge"]

# the Lean of the Q++ modules, generated by qpp/kernel.py (one file per module of modules/, imports by its
# `uses`); do not edit QppModules/: edit the module and regenerate
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "QppModules"

# the Lean of qpp/examples/vocabulary.qpp (qpp/kernel.py, unit gen-qpp-examples-mathlib): every vocabulary
# row and proof word over Mathlib, used once, so that a change of the generator that breaks one is built here; the
# same over the kernel, as the modules are generated (QppExamples.Kernel, unit gen-qpp-examples-kernel); and the other
# examples (unit gen-qpp-examples): means.qpp and programs.qpp over the kernel, pairs.qpp (both signs) over Mathlib
[[lean_lib]]
name = "QppExamples"
roots = ["QppExamples.Vocabulary", "QppExamples.Kernel", "QppExamples.Means", "QppExamples.Programs",
         "QppExamples.Pairs"]

# the kernel of Q++ (qpp/lean): counts and masses over Lean core, the meaning of the statements of the modules
[[require]]
name = "qpp"
path = "../qpp/lean"

# the bridge of the kernel to Mathlib: the readings of the words of qpp/lean/QppKernel over Mathlib, as equivalences,
# and one transport lemma per word (simp set qpp_bridge); the statements of the modules name the kernel, and their
# proofs reach Mathlib through it
[[lean_lib]]
name = "QppBridge"

# The Palomar entry of this project (comparator.json): the Challenge and the Solution of the module corner
# (qpp/modlean.py --palomar); the Challenge states the theorems of its rows over Mathlib with `sorry`, by design, and
# is built only by `lake build QppPalomar` and `lake comparator`. The Challenge and the Solution of the example means,
# over the kernel (qpp/kernel.py --kernel-target), are built with them
[[lean_lib]]
name = "QppPalomar"
roots = ["QppPalomar.Corner.Challenge", "QppPalomar.Corner.Solution", "QppExamples.Means.Challenge",
         "QppExamples.Means.Solution"]
