# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4: the Palomar metadata of the Lake project lean/. Its entry is the module
# modules/corner/corner.qpp: qpp/modlean.py --palomar generates the Challenge, the Solution and comparator.json from
# the generated Lean of the module. The workflow palomar.yml validates this file with Palomar's own code. The fields on
# authorship, automation and review are declarations of the author: check them before any submission.
version: "v0.4"

project:
  name: "Formal sources of \"Zeta functions and monodromy of degenerate hypersurface singularities over the positive rationals: least action and spectrum as dual readings\""
  description: >-
    Q++ is the expression language of the article, over the counts (the
    positive integers) and the masses (the positive rationals). Its kernel
    has three symbols, 1, + and /. There is no zero: NN and QQ>=0 add an
    absent value to the counts and the masses, and a difference is the
    deficit max(a - b, 0), absent when a <= b. The kernel builds the counts
    as an inductive type and the masses as pairs of counts, on Lean core
    alone; a bridge shows them equivalent to Mathlib's positive naturals and
    rationals. Each module of the article is written in Q++, and its rows
    are generated in Lean, each proved over Mathlib and stated again over
    the kernel. The Palomar entry is the module modules/corner/corner.qpp:
    its 61 rows, stated over Mathlib's rationals and naturals.
  authors:
    - name: "Agostino Russo"
      orcid: "0009-0004-5240-9403"
      github: "agoru"
  # The repository root licence, LICENSE.
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Agostino Russo"
      orcid: "0009-0004-5240-9403"
      github: "agoru"

classification:
  arxiv: ["math.AG", "math.NT", "math.LO"]
  msc2020: ["14B05", "11S40", "32S40", "03B35", "68V15"]

sources:
  - title: "Zeta functions and monodromy of degenerate hypersurface singularities over the positive rationals: least action and spectrum as dual readings"
    authors:
      - "Agostino Russo"
    type: "paper"
    id: "doi:10.5281/zenodo.24569077"
    location: "https://doi.org/10.5281/zenodo.24569077"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    Comparator checks the 61 rows of modules/corner/corner.qpp: thm:corner (40), lem:mark (2), cor:cornermonodromy (1), thm:level (4), cor:levelmonodromy (2), cor:towerreach (1), thm:strata (1), thm:contact (8), cor:contactmonodromy (2).
    Each row is a closed statement over the positive rationals and the
    counts (an identity, an inequality, or the value of a pole or of its
    residue), stated over Mathlib's rationals and naturals with the
    hypotheses that the row names. The geometric statements that the article
    reads on these rows (the zeta functions of a polynomial on a resolution,
    the monodromy of its Milnor fibre, the number of points of a reduction at
    a good prime) rest on the cited facts of the module (fact:zetatop,
    fact:acampo, fact:suspension and the others), which are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code sessions in cloud containers with Lean 4, writing the
        kernel, the generator and the Q++ modules from the author's
        instructions; the Lean kernel, NanoDa, con-ron and an axiom audit
        check the results.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "cloud containers"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The author set the goals and the constraints (a discrete, positive theory
    over Q, a kernel on Lean core) and directed AI agents that wrote the
    kernel, the generator and the modules; every proof is checked by Lean.

fidelity:
  divergences: >-
    None in the rows: the Lean statements are generated from the Q++ source by
    qpp/kernel.py. The article states each row under the hypotheses of its
    item, in words; the Lean statement of a row takes the hypotheses that the
    row names and no other.

review:
  status: "not independently reviewed"
  reviewers: []
  notes: >-
    No human referee has reviewed the formalization. The Challenge repeats the
    statement of each row as the library defines it, verbatim, and Comparator
    checks that the Solution proves the same statements with propext,
    Quot.sound and Classical.choice only.

