# The Lean constants of each primitive of Q++ (the rows of PRIMITIVES in qpp/kernel.py, printed in qpp/README.md):
# the names that the Lean form of the row elaborates to, instances left out (they follow from the types). The audit
# of the generated statements (tools/statement_constants.lean, tools/check_statements.py, unit lean-modules) fails
# on any constant of a statement that no row lists. `python3 -m qpp.modules check` fails unless the rows here are
# exactly the rows of PRIMITIVES, so that no constant is admitted without a primitive. The casts are the reading of a
# natural number or of an NNRat value in Rat.
#
# The kernel target of the modules: `kernel` gives the constants of each primitive over the kernel words
# (qpp/lean/QppKernel/Words.lean) and Lean core, against which the statements of the modules (QppModules, namespace
# Qpp.Modules) are checked; `constants` stays the table of the statements over Mathlib (the examples, QppExamples).
# A numeral of Lean is a literal of `Nat` read as a count or a mass (`OfNat`), and a numeral exponent is `NatPow`
# (qpp/lean/QppKernel/Words.lean). A row with no `kernel` key is not yet over the kernel.

[[row]]
qpp = "x in NN"
constants = ["Nat", "Nat.cast"]
kernel = ["Qpp.Count0"]

[[row]]
qpp = "x in NN>=k"
constants = ["Nat", "LE.le", "OfNat.ofNat", "Nat.cast"]
kernel = ["Qpp.Count", "Qpp.Count0.of", "LE.le", "OfNat.ofNat", "Qpp.Mass.ofCount"]

[[row]]
qpp = "x in QQ>=0"
constants = ["Rat", "LE.le", "OfNat.ofNat"]
kernel = ["Qpp.Mass0"]

[[row]]
qpp = "x in QQ>0"
constants = ["Rat", "LT.lt", "OfNat.ofNat"]
kernel = ["Qpp.Mass", "Qpp.Mass0.of"]

[[row]]
qpp = "x in {0, 1}"
constants = ["Rat", "Eq", "Or", "OfNat.ofNat"]

[[row]]
qpp = "a_(1..k) in S"
constants = ["Nat"]

[[row]]
qpp = "c := t (in a context)"
constants = ["Eq"]

[[row]]
qpp = "QQ>=0"
constants = ["NNRat"]
kernel = ["Qpp.Mass0"]

[[row]]
qpp = "QQ>0 (the positive rationals)"
constants = ["Subtype", "Rat", "LT.lt", "OfNat.ofNat"]
kernel = ["Qpp.Mass", "Qpp.Mass0.of"]

[[row]]
qpp = "NN>=1 (the positive counts, as coordinates: (NN>=1)^n, ((NN>=1)^n)^k, and a part of a bundle)"
constants = ["Subtype", "Nat", "LT.lt", "OfNat.ofNat"]
kernel = ["Qpp.Count", "Qpp.Count0.of"]

[[row]]
qpp = "NN"
constants = ["Nat"]
kernel = ["Qpp.Count0", "Qpp.Mass0.ofCount0"]

[[row]]
qpp = "X^n"
constants = ["Fin", "Nat"]
kernel = ["Qpp.Idx"]

[[row]]
qpp = "(X^n)^k (a tuple of tuples: k rows of n coordinates, X one of NN, NN>=1, QQ>=0, QQ>0)"
constants = ["Fin", "Nat"]
kernel = ["Qpp.Idx"]

[[row]]
qpp = "(X -> Y)"
constants = []
kernel = []

[[row]]
qpp = "(X -> QQ>0), (X -> NN>=1) (a function with positive values)"
constants = ["Subtype", "Rat", "Nat", "LT.lt", "OfNat.ofNat"]
kernel = ["Qpp.Mass", "Qpp.Count", "Qpp.Mass0.of", "Qpp.Count0.of"]

[[row]]
