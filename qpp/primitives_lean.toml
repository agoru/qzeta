constants = ["Finset.sum", "Finset.filter", "Finset.Icc", "Finset.univ", "Fin", "OfNat.ofNat", "And"]
kernel = ["Qpp.rangeSum", "Qpp.Idx", "Qpp.Idx.sum", "Qpp.boxSum", "Qpp.iverson", "Qpp.iversonN", "And"]

[[row]]
